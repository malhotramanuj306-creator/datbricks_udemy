bundle:
  name: dab_tutorial
  uuid: e2c18ce3-136e-4792-b87c-fcb4b239cca0

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: dbc-6238cf63-281f.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
    presets:
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment: false

  prod:
    mode: production
    workspace:
      host: dbc-6238cf63-281f.cloud.databricks.com
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: malhotramanuj306@gmail.com
        level: CAN_MANAGE
      - group_name: admins
        level: CAN_RUN
